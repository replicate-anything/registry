name: Replications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  replications:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::testthat
            any::ggplot2
            any::haven
            any::dplyr
            any::kableExtra
            any::modelsummary
            any::texreg
            any::bbmle
            any::forcats
            any::egg
            any::knitr
            any::broom
            any::patchwork
            replicate-anything/replicateEverything

      - name: Build replication artifacts
        run: Rscript scripts/build_outputs.R

      - name: Check for artifact changes
        run: git diff --exit-code
